[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beeui"
version = "0.26.4"
description = "Reusable UI framework for Bee products"
readme = "README.ru.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "uvicorn==0.52.1",
]

[dependency-groups]
dev = [
    "httpx2==2.10.0",
    "pytest==9.1.1",
]

[project.scripts]
beeui = "beeui_module.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"beeui_module.web" = [
    "templates/*.html",
    "templates/components/*.html",
    "templates/components/*/*.html",
    "templates/components/*/*/*.html",
    "templates/components/*/*/*/*.html",
    "templates/artifacts/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/vendor/tabler/**/*",
    "static/vendor/apexcharts/**/*",
    "static/vendor/litepicker/**/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: tests that involve filesystem recovery, route smoke, or larger fixture setup",
]